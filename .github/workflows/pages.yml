# Privacy policy site — replaces GitHub's legacy "pages-build-deployment"
# (that workflow still pins checkout@v4 / upload-artifact@v4 → Node 20 warning).
name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "docs/privacy-policy.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage public Pages files
        run: |
          mkdir -p _site
          cp docs/privacy-policy.html _site/privacy-policy.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
