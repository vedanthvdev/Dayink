# Manual store builds only — avoids burning EAS free-plan quota on every merge.
# Run from Actions → Release → Run workflow (pick platform).
name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store build(s) to start on EAS
        type: choice
        required: true
        default: both
        options:
          - both
          - ios
          - android
      auto_submit:
        description: Auto-submit to TestFlight / Play internal after build
        type: boolean
        required: true
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Quality gate
        uses: ./.github/actions/quality-gate

  ios-testflight:
    name: ios-testflight
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN. See docs/ci-cd.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (production → TestFlight)
        run: |
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            npx eas-cli@21.0.2 build -p ios --profile production --non-interactive --auto-submit --no-wait
          else
            npx eas-cli@21.0.2 build -p ios --profile production --non-interactive --no-wait
          fi

  android-internal:
    name: android-internal
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN. See docs/ci-cd.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: EAS Build (production → Play internal)
        run: |
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            npx eas-cli@21.0.2 build -p android --profile production --non-interactive --auto-submit --no-wait
          else
            npx eas-cli@21.0.2 build -p android --profile production --non-interactive --no-wait
          fi
